<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}.logo{font-size:23px;font-weight:900;letter-spacing:4px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.btn{border:0;border-radius:10px;background:var(--ink);color:white;padding:11px 15px;font-weight:650}.btn.alt{background:#eee;color:#222}.btn.red{background:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0 20px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;padding:10px 14px;border-radius:99px}.tabs button.active{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#555}.field input,.field textarea,.field select{width:100%;border:1px solid #d8d8d2;border-radius:9px;background:white;padding:11px;color:var(--ink)}textarea{min-height:88px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.row .grow{flex:1}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:12px;align-items:flex-start;background:#fff}.item+.item{margin-top:9px}.thumb{width:68px;height:78px;border-radius:8px;background:#eee;object-fit:cover;flex:none}.image-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.image-preview:empty{display:none}.image-preview figure{margin:0;position:relative;aspect-ratio:1;background:#eee;border-radius:10px;overflow:hidden}.image-preview img{width:100%;height:100%;object-fit:contain;display:block}.image-preview button{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;color:#a00;font-size:18px}.iteminfo{min-width:0;flex:1}.iteminfo b{display:block;overflow-wrap:anywhere}.iteminfo small{display:block;color:var(--muted);margin-top:3px}.itemactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.status{display:inline-block;padding:4px 8px;border-radius:99px;background:#f1f1ef;font-size:11px}.status.ok{background:#e4f5eb;color:#176a3d}.status.warn{background:#fff0d5;color:#81510a}.notice{padding:12px 14px;border-radius:10px;margin:12px 0;background:#e7f6ec;color:#155e35}.notice.err{background:#ffebeb;color:#9b2020}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border-radius:12px;background:#f3f3f0}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}.order{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.small{font-size:12px}.danger{color:#b4232b}.section-title{margin:0 0 6px;font-size:20px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:12px}.modal.open{display:flex}.modalbox{background:var(--bg);width:min(700px,100%);max-height:92dvh;overflow:auto;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:36px;height:36px;background:#e9e9e6;font-size:20px}@media(min-width:760px){.shell{padding:30px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.item{align-items:center}}
 .image-preview select{max-width:100%}
</style></head><body><main class="shell">
<header class="top"><div><div class="logo">FABELL</div><div class="muted small">Store administration</div></div><button class="btn alt hidden" id="logout">Sign out</button></header>
<section class="card" id="login">
<h1 class="section-title">Admin sign in</h1><p class="hint">Sign in using the administrator account that is authorized in this Supabase project. Only the designated admin account can save store changes or update delivery tracking.</p>

</section>
<section id="app" class="hidden">

<div class="stats"><div class="stat"><b id="statProducts">—</b><span>Products</span></div><div class="stat"><b id="statBanners">—</b><span>Homepage banners</span></div><div class="stat"><b id="statOrders">—</b><span>Orders</span></div></div>
<nav class="tabs" id="tabs"><button class="active" data-tab="products">Products</button><button data-tab="banners">Homepage</button><button data-tab="settings">Store design & settings</button><button data-tab="orders">Orders & tracking</button></nav>
<section id="panel"></section>
</section></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Edit</h2><button class="close" id="modalClose" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://rxtxyltywwfppaastfyn.supabase.co';
const SUPABASE_KEY='sb_publishable_Mo7SOjDPOZUt5bHrHzMX7w_Pm3C0L-i';
const ADMIN_UID='5e465c5d-2fb8-4374-823e-2fb5a03c2339';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let payload={products:[],banners:[],settings:{}},orders=[],tab='products';
const statuses=['placed','confirmed','processing','dispatched','in_transit','out_for_delivery','delivered','cancelled','returned'];
function say(msg,error=false){$('#notice').textContent=msg;$('#notice').className='notice'+(error?' err':'');$('#notice').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
async function loadData(){const {data,error}=await sb.from('store_data').select('payload').eq('id',1).single();if(error)throw error;payload=data.payload||{};payload.products=Array.isArray(payload.products)?payload.products:[];payload.banners=Array.isArray(payload.banners)?payload.banners:[];payload.settings=payload.settings||{};}
async function saveData(){payload.updatedAt=new Date().toISOString();const {error}=await sb.from('store_data').update({payload,updated_at:new Date().toISOString()}).eq('id',1);if(error)throw error;}
async function loadOrders(){const {data,error}=await sb.from('store_orders').select('*').order('created_at',{ascending:false}).limit(250);if(error)throw error;orders=data||[]}
async function refresh(){await loadData();await loadOrders();$('#statProducts').textContent=payload.products.length;$('#statBanners').textContent=payload.banners.length;$('#statOrders').textContent=orders.length;renderTab();}
function switchTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderTab()}
function renderTab(){if(tab==='products')renderProducts();if(tab==='banners')renderBanners();if(tab==='settings')renderSettings();if(tab==='orders')renderOrders()}
function renderProducts(){const list=payload.products;$('#panel').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2 class="section-title">Products</h2><p class="hint">Create, edit, remove, or reorder your catalogue. Image URLs should be publicly accessible; use the existing store-images bucket for uploads.</p></div><button class="btn" id="addProduct">+ Add product</button></div><div>${list.map((p,i)=>`<article class="item"><img class="thumb" src="${esc(p.cardImage||(p.images||[])[0]||'')}" onerror="this.style.display='none'"><div class="iteminfo"><b>${esc(p.title||p.n||'Untitled product')}</b><small>${esc(p.category||p.c||'Uncategorised')} · ${money(p.price??p.p)} · ID ${esc(p.id)}</small><small>${esc(p.description||p.d||'')}</small><div class="itemactions"><button class="btn alt" data-edit-product="${i}">Edit</button><button class="btn alt" data-move-product="${i}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="btn alt" data-move-product="${i}" data-dir="1" ${i===list.length-1?'disabled':''}>↓</button><button class="btn red" data-delete-product="${i}">Delete</button></div></div></article>`).join('')||'<div class="card">No products yet. Add your first product.</div>'}</div>`;
$('#addProduct').onclick=()=>editProduct(-1);document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>editProduct(+b.dataset.editProduct));document.querySelectorAll('[data-delete-product]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.deleteProduct;if(!confirm('Delete this product?'))return;payload.products.splice(i,1);await persistAndRender()});document.querySelectorAll('[data-move-product]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.moveProduct,j=i+(+b.dataset.dir);[payload.products[i],payload.products[j]]=[payload.products[j],payload.products[i]];await persistAndRender()});}
function editProduct(i){const p=i<0?{id:'p'+Date.now(),title:'',type:'tee',price:0,sizes:['S','M','L','XL'],gender:'Unisex',images:[],category:'Clothing',description:''}:structuredClone(payload.products[i]);openModal(i<0?'Add product':'Edit product',`<div class="grid"><div class="field"><label>Product name</label><input id="p_title" value="${esc(p.title||p.n)}"></div><div class="field"><label>Product ID (unique)</label><input id="p_id" value="${esc(p.id)}"></div><div class="field"><label>Price (₹)</label><input id="p_price" type="number" min="0" step="1" value="${Number(p.price??p.p??0)}"></div><div class="field"><label>Category</label><input id="p_category" value="${esc(p.category||p.c||'Clothing')}"></div><div class="field"><label>Product type</label><input id="p_type" value="${esc(p.type||p.t||'tee')}"></div><div class="field"><label>Gender / audience</label><input id="p_gender" value="${esc(p.gender||p.g||'Unisex')}"></div><div class="field"><label>Sizes (comma separated)</label><input id="p_sizes" value="${esc((p.sizes||[]).join(', '))}"></div><div class="field"><label>Colour / artwork key</label><input id="p_color" value="${esc(p.color||p.col||'#222222')}"></div><div class="field"><label>Product images (JPG, PNG, WebP)</label><input id="p_uploads" type="file" accept="image/jpeg,image/png,image/webp" multiple><button class="btn alt" type="button" id="uploadProductImages">Upload selected image(s)</button><small class="hint" id="uploadProductMsg">Select images from your phone. Uploaded images will be saved with this product.</small><div id="p_image_preview" class="image-preview"></div><label for="p_cardImage" style="display:block;margin-top:12px">Image shown on product cards</label><select id="p_cardImage"></select><textarea id="p_images" class="hidden" aria-hidden="true">${esc((p.images||[]).join('\n'))}</textarea></div><div class="field"><label>Product badge</label><select id="p_badge"><option value="" ${!(p.badge||((p.isNew||p.nw)?'New Arrival':''))?'selected':''}>No badge</option>${['New Arrival','Popular Picks','Best Seller','Trending'].map(b=>`<option value="${b}" ${(p.badge||((p.isNew||p.nw)?'New Arrival':''))===b?'selected':''}>${b}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><textarea id="p_desc">${esc(p.description||p.d||'')}</textarea></div><div class="row"><button class="btn" id="saveProduct">Save product</button><button class="btn alt" id="cancelProduct">Cancel</button></div>`);
const drawImagePreview=()=>{const urls=$('#p_images').value.split('\n').map(x=>x.trim()).filter(Boolean);$('#p_image_preview').innerHTML=urls.map((url,j)=>'<figure><img src="'+esc(url)+'" alt="Product image '+(j+1)+'"><button type="button" data-remove-image="'+j+'" aria-label="Remove image">×</button></figure>').join('');const cardSelect=$('#p_cardImage'),selected=cardSelect.value||p.cardImage||urls[0]||'';cardSelect.innerHTML='<option value="">Use first image by default</option>'+urls.map((url,j)=>'<option value="'+esc(url)+'">Image '+(j+1)+'</option>').join('');cardSelect.value=urls.includes(selected)?selected:'';$('#p_image_preview').querySelectorAll('[data-remove-image]').forEach(b=>b.onclick=()=>{const arr=$('#p_images').value.split('\n').map(x=>x.trim()).filter(Boolean);arr.splice(+b.dataset.removeImage,1);$('#p_images').value=arr.join('\n');drawImagePreview()})};drawImagePreview();$('#cancelProduct').onclick=closeModal;$('#uploadProductImages').onclick=async()=>{const files=[...($('#p_uploads').files||[])];if(!files.length){$('#uploadProductMsg').textContent='Choose one or more image files first.';return}const msg=$('#uploadProductMsg'),btn=$('#uploadProductImages');btn.disabled=true;try{const urls=$('#p_images').value.split('\n').map(x=>x.trim()).filter(Boolean);for(let j=0;j<files.length;j++){const file=files[j];if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error(file.name+' is not a JPG, PNG or WebP image');if(file.size>8*1024*1024)throw new Error(file.name+' is larger than 8 MB');const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'})[file.type],path='products/'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('store-images').upload(path,file,{upsert:false,contentType:file.type,cacheControl:'3600'});if(error)throw error;urls.push(sb.storage.from('store-images').getPublicUrl(path).data.publicUrl);$('#p_images').value=urls.join('\n');drawImagePreview();msg.textContent='Uploaded '+(j+1)+' of '+files.length+' image(s)…'}msg.textContent=files.length+' image(s) uploaded. Tap Save product to publish them.';$('#p_uploads').value=''}catch(e){msg.textContent=e.message||'Upload failed';say(msg.textContent,true)}finally{btn.disabled=false}};$('#saveProduct').onclick=async()=>{const id=$('#p_id').value.trim();if(!id||!$('#p_title').value.trim()){say('Product ID and name are required.',true);return}if(payload.products.some((x,j)=>String(x.id)===id&&j!==i)){say('Product ID must be unique.',true);return}const next={...p,id,title:$('#p_title').value.trim(),price:Number($('#p_price').value||0),category:$('#p_category').value.trim()||'Clothing',type:$('#p_type').value.trim()||'tee',gender:$('#p_gender').value.trim()||'Unisex',sizes:$('#p_sizes').value.split(',').map(x=>x.trim()).filter(Boolean),color:$('#p_color').value.trim()||'#222222',images:$('#p_images').value.split('\n').map(x=>x.trim()).filter(Boolean),cardImage:$('#p_cardImage').value||$('#p_images').value.split('\n').map(x=>x.trim()).filter(Boolean)[0]||'',badge:$('#p_badge').value,isNew:$('#p_badge').value==='New Arrival',description:$('#p_desc').value.trim()};if(!Number.isFinite(next.price)||next.price<0){say('Enter a valid non-negative price.',true);return}if(i<0)payload.products.push(next);else payload.products[i]=next;closeModal();await persistAndRender();};}
function renderBanners(){const list=payload.banners;$('#panel').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2 class="section-title">Homepage banners</h2><p class="hint">Edit the slide text, call-to-action, category and image URL.</p></div><button class="btn" id="addBanner">+ Add banner</button></div>${list.map((b,i)=>`<article class="item"><img class="thumb" src="${esc(b.img||b.image||'')}" onerror="this.style.display='none'"><div class="iteminfo"><b>${esc(b.title||'Untitled banner')}</b><small>${esc(b.subtitle||b.s||'')}</small><div class="itemactions"><button class="btn alt" data-edit-banner="${i}">Edit</button><button class="btn red" data-delete-banner="${i}">Delete</button></div></div></article>`).join('')||'<div class="card">No banners yet.</div>'}`;$('#addBanner').onclick=()=>editBanner(-1);document.querySelectorAll('[data-edit-banner]').forEach(b=>b.onclick=()=>editBanner(+b.dataset.editBanner));document.querySelectorAll('[data-delete-banner]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this banner?'))return;payload.banners.splice(+b.dataset.deleteBanner,1);await persistAndRender()});}
function editBanner(i){const b=i<0?{title:'',subtitle:'',badge:'',btnText:'Shop Now',category:'Clothing',img:''}:structuredClone(payload.banners[i]);openModal(i<0?'Add banner':'Edit banner',`<div class="field"><label>Title</label><input id="b_title" value="${esc(b.title||b.h)}"></div><div class="field"><label>Subtitle</label><textarea id="b_sub">${esc(b.subtitle||b.s||'')}</textarea></div><div class="field"><label>Badge / eyebrow</label><input id="b_badge" value="${esc(b.badge||'') }"></div><div class="field"><label>Button text</label><input id="b_btn" value="${esc(b.btnText||b.b||'Shop Now')}"></div><div class="field"><label>Category</label><input id="b_cat" value="${esc(b.category||b.cat||'Clothing')}"></div><div class="field"><label>Image URL</label><input id="b_img" value="${esc(b.img||b.image||'')}" placeholder="https://..."></div><div class="field"><label>Or upload banner image</label><input id="b_upload" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn alt" type="button" id="uploadBannerImage">Upload banner image</button><small id="bannerUploadMsg" class="hint"></small></div><div class="row"><button class="btn" id="saveBanner">Save banner</button><button class="btn alt" id="cancelBanner">Cancel</button></div>`);$('#cancelBanner').onclick=closeModal;$('#uploadBannerImage').onclick=async()=>{const file=$('#b_upload').files?.[0];if(!file){$('#bannerUploadMsg').textContent='Choose an image first.';return}if(file.size>8*1024*1024){$('#bannerUploadMsg').textContent='Image must be 8 MB or smaller.';return}const msg=$('#bannerUploadMsg');msg.textContent='Uploading…';try{const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='banners/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;const {error}=await sb.storage.from('store-images').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg',cacheControl:'3600'});if(error)throw error;$('#b_img').value=sb.storage.from('store-images').getPublicUrl(path).data.publicUrl;msg.textContent='Uploaded. Save the banner to publish it.'}catch(e){msg.textContent=e.message||'Upload failed';say(msg.textContent,true)}};$('#saveBanner').onclick=async()=>{const n={...b,title:$('#b_title').value.trim(),subtitle:$('#b_sub').value.trim(),badge:$('#b_badge').value.trim(),btnText:$('#b_btn').value.trim(),category:$('#b_cat').value.trim(),img:$('#b_img').value.trim()};if(!n.title){say('Banner title is required.',true);return}if(i<0)payload.banners.push(n);else payload.banners[i]=n;closeModal();await persistAndRender()}}
function renderSettings(){const s=payload.settings||{};$('#panel').innerHTML=`<h2 class="section-title">Store design & settings</h2><p class="hint">These values are saved to the shared store settings. Some visual changes require the storefront to read these settings; the new storefront integration will consume them.</p><div class="grid"><div class="field"><label>Store name</label><input id="s_name" value="${esc(s.storeName||'Fabell')}"></div><div class="field"><label>Logo / wordmark</label><input id="s_logo" value="${esc(s.logoText||'FABELL')}"></div><div class="field"><label>Announcement bar</label><input id="s_announce" value="${esc(s.announcement||'')}"></div><div class="field"><label>Currency code</label><input id="s_currency" value="${esc(s.currency||'INR')}"></div><div class="field"><label>Background colour</label><input id="s_bg" type="color" value="${esc(s.backgroundColor||'#f4f4f4')}"></div><div class="field"><label>Product card colour</label><input id="s_card" type="color" value="${esc(s.cardColor||'#ffffff')}"></div><div class="field"><label>Product card corner radius</label><select id="s_radius"><option value="12px" ${s.borderRadius==='12px'?'selected':''}>Soft (12px)</option><option value="16px" ${!s.borderRadius||s.borderRadius==='16px'?'selected':''}>Default (16px)</option><option value="24px" ${s.borderRadius==='24px'?'selected':''}>Rounded (24px)</option></select></div><div class="field"><label>Homepage hero height</label><select id="s_hero"><option value="48dvh" ${s.heroHeight==='48dvh'?'selected':''}>Compact</option><option value="58dvh" ${!s.heroHeight||s.heroHeight==='58dvh'?'selected':''}>Default</option><option value="68dvh" ${s.heroHeight==='68dvh'?'selected':''}>Tall</option></select></div><div class="field"><label>Text colour</label><input id="s_text" type="color" value="${esc(s.textColor||'#111111')}"></div><div class="field"><label>Primary / button colour</label><input id="s_primary" type="color" value="${esc(s.primaryColor||'#111111')}"></div><div class="field"><label>Font family</label><select id="s_font"><option ${s.fontFamily==='Inter'?'selected':''}>Inter</option><option ${s.fontFamily==='Arial'?'selected':''}>Arial</option><option ${s.fontFamily==='Georgia'?'selected':''}>Georgia</option><option ${s.fontFamily==='system-ui'?'selected':''}>system-ui</option></select></div><div class="field"><label>Hero autoplay</label><select id="s_auto"><option value="true" ${s.heroAutoplay!==false?'selected':''}>On</option><option value="false" ${s.heroAutoplay===false?'selected':''}>Off</option></select></div></div><button class="btn" id="saveSettings">Save settings</button><p class="hint">For more advanced layout changes—hero height, product grid columns, border radius, section spacing, etc.—we can expose additional design controls once the storefront is connected to this settings object.</p>`;
$('#saveSettings').onclick=async()=>{payload.settings={...s,storeName:$('#s_name').value.trim(),logoText:$('#s_logo').value.trim(),announcement:$('#s_announce').value,currency:$('#s_currency').value.trim()||'INR',backgroundColor:$('#s_bg').value,cardColor:$('#s_card').value,borderRadius:$('#s_radius').value,heroHeight:$('#s_hero').value,textColor:$('#s_text').value,primaryColor:$('#s_primary').value,fontFamily:$('#s_font').value,heroAutoplay:$('#s_auto').value==='true'};await persistAndRender()}}
function renderOrders(){const list=orders;$('#panel').innerHTML=`<h2 class="section-title">Orders & delivery tracking</h2><p class="hint">Update the order stage and courier details. Customers should only see their own orders; this dashboard is admin-only. The current storefront still needs customer sign-in and secure order creation wired in before real checkout orders will appear here.</p><div class="field"><label>Filter orders</label><input id="orderFilter" placeholder="Order number, tracking number, status..."></div><div id="orderList">${list.map(o=>orderHTML(o)).join('')||'<div class="card">No real orders in the database yet.</div>'}</div>`;$('#orderFilter').oninput=()=>{$('#orderList').innerHTML=orders.filter(o=>JSON.stringify(o).toLowerCase().includes($('#orderFilter').value.toLowerCase())).map(orderHTML).join('')||'<div class="card">No matching orders.</div>'};bindOrderButtons();}
function orderHTML(o){const address=o.shipping_address||{};return `<article class="order"><div class="orderhead"><div><b>${esc(o.order_number||o.id)}</b><div class="small muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="status ${o.status==='delivered'?'ok':(['cancelled','returned'].includes(o.status)?'warn':'')}">${esc(o.status||'placed').replaceAll('_',' ')}</span></div><p class="small">Customer ID: ${esc(o.user_id)} · Total: <b>${money(o.total)}</b></p><p class="small">${esc(address.name||'')} ${esc(address.phone||'')}<br>${esc([address.address,address.city,address.state,address.pin].filter(Boolean).join(', '))}</p><p class="small">Items: ${esc((o.items||[]).map(i=>(i.title||i.n||'Item')+' × '+(i.qty||1)+(i.size?' / '+i.size:'')).join(', '))}</p><div class="grid"><div class="field"><label>Status</label><select id="status_${o.id}">${statuses.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select></div><div class="field"><label>Courier / carrier</label><input id="carrier_${o.id}" value="${esc(o.tracking_carrier||'')}"></div><div class="field"><label>Tracking number</label><input id="trackno_${o.id}" value="${esc(o.tracking_number||'')}"></div><div class="field"><label>Tracking URL</label><input id="trackurl_${o.id}" type="url" value="${esc(o.tracking_url||'')}" placeholder="https://courier-tracking-link"></div><div class="field"><label>Estimated delivery</label><input id="eta_${o.id}" type="date" value="${esc(o.estimated_delivery||'')}"></div><div class="field"><label>Customer-facing tracking note</label><input id="note_${o.id}" value="${esc(o.tracking_note||'')}" placeholder="e.g. Parcel reached Kozhikode hub"></div></div><button class="btn" data-save-order="${o.id}">Save tracking update</button></article>`}
function bindOrderButtons(){document.querySelectorAll('[data-save-order]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveOrder;const o=orders.find(x=>x.id===id);if(!o)return;const status=$('#status_'+id).value;const note=$('#note_'+id).value.trim();const history=Array.isArray(o.status_history)?o.status_history.slice():[];if(status!==o.status||note!==o.tracking_note)history.push({status,note,at:new Date().toISOString()});const patch={status,tracking_carrier:$('#carrier_'+id).value.trim(),tracking_number:$('#trackno_'+id).value.trim(),tracking_url:$('#trackurl_'+id).value.trim(),estimated_delivery:$('#eta_'+id).value||null,tracking_note:note,status_history:history,updated_at:new Date().toISOString()};const {error}=await sb.from('store_orders').update(patch).eq('id',id);if(error){say(error.message,true);return}say('Tracking updated.');await refresh()})}
async function persistAndRender(){try{await saveData();say('Saved to the shared store database.');await refresh()}catch(e){say(e.message||'Could not save changes.',true)}}
async function enterApp(user){if(!user||user.id!==ADMIN_UID){await sb.auth.signOut();$('#loginmsg').textContent='This account is not the designated Fabell administrator.';return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');try{await refresh()}catch(e){say(e.message||'Could not load store data.',true)}}
$('#signin').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;$('#loginmsg').textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('#loginmsg').textContent=error.message;return}await enterApp(data.user)};
$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)};
(async()=>{const {data}=await sb.auth.getSession();if(data.session)await enterApp(data.session.user)})();
</script></body></html>
