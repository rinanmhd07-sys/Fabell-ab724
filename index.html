<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>Fabell</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f4f4;--card:#fff;--ink:#111;--mut:#777;--line:#e5e5e5;--red:#111;--radius:16px;--hero-height:58dvh;color-scheme:light}
html,body{margin:0;background:#dcdcdc;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;color:var(--ink);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.frame{max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.15)}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;animation:fin .25s ease;padding-top:env(safe-area-inset-top,0px)}
@keyframes fin{from{opacity:0}to{opacity:1}}
svg{display:block}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.sec .ib{background:#fff;border:1px solid var(--line)}
.pill{height:44px;border-radius:30px;padding:0 14px;gap:6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);position:relative;font-weight:600;font-size:14px}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.badge:empty,.badge.z{display:none}
/* headers */
.hh{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0}
.hh .r{display:flex;gap:8px}
.hdr{position:relative;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.hdr h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;font-size:17px;font-weight:700;pointer-events:none;white-space:nowrap}
.hdr .r{display:flex;gap:8px;min-width:44px;justify-content:flex-end}
/* hero */
.brand-wordmark{position:absolute;z-index:7;top:calc(24px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.18em;color:#fff;text-shadow:0 1px 6px #0008;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}.has-announcement .brand-wordmark{top:calc(54px + env(safe-area-inset-top,0px))}.slide .art:has(img){inset:0;right:0;top:0;width:100%;height:100%}.announcement{min-height:30px;padding:7px 12px;text-align:center;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;letter-spacing:.08em}.has-announcement .hh{top:30px}.hero{position:relative;height:clamp(340px,var(--hero-height),520px);overflow:hidden;background:#333;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.slide.on{opacity:1}
.slide .art{position:absolute;right:-6%;top:6%;width:100%;height:70%}
.slide .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 60%)}
.slide .tx{position:absolute;left:20px;right:20px;bottom:62px;color:#fff}
.slide h2{margin:0 0 8px;font-size:clamp(36px,11.5vw,46px);line-height:.98;font-weight:700;letter-spacing:-1.8px;max-width:260px}
.slide p{margin:0 0 16px;font-size:14px;opacity:.9}
.cta{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111;border-radius:30px;height:44px;padding:0 6px 0 18px;font-weight:600;font-size:14px}
.cta i{width:32px;height:32px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center}
.cta i .ic{width:14px;height:14px}
.tag{position:absolute;right:20px;bottom:76px;color:#fff;font-size:13px;display:flex;gap:8px;align-items:center;max-width:120px;line-height:1.25}
.tag .ic{width:24px;height:24px;flex:none}
.dots{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.dots b{width:30px;height:3px;border-radius:3px;background:rgba(255,255,255,.4);transition:background .3s}
.dots b.on{background:#fff}
/* categories */
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:30px;background:#fafafa;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mut);transition:.2s}
.cat.nt{padding-left:16px}
.cat i{width:30px;height:30px;border-radius:50%;background:#fff;display:block;overflow:hidden}
.cat.on{background:#111;border-color:#111;color:#fff}
/* grid */
.cols{display:flex;gap:8px;padding:4px 12px 24px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.pc{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative;cursor:pointer}
.pi{background:#f1f1f1;width:100%;aspect-ratio:4/5;overflow:hidden}.pi img{width:100%;height:100%;object-fit:contain;display:block}.pb{min-height:96px;display:flex;flex-direction:column}.pb b{min-height:2.5em}.pb span{margin-top:auto;padding-top:4px}
.pi svg{width:100%;height:100%}
.pb{padding:10px 12px 14px}
.pb small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}
.pb b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.pb span{display:block;font-size:15px;font-weight:700;margin-top:4px}
.heart{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:2;flex:none}
.heart .ic{width:18px;height:18px;transition:fill .15s,stroke .15s}
.hh .heart{position:static;width:44px;height:44px;top:auto;right:auto}
.heart.on .ic{fill:var(--red);stroke:var(--red)}
.empty{padding:50px 20px;text-align:center;color:var(--mut);font-size:14px}
/* buttons */
.btn{height:52px;border-radius:30px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 24px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.dk{background:var(--red);color:#fff}
.ol{background:#fff;color:#111;border:1.5px solid #111}
.sm{height:40px;font-size:13px;padding:0 16px}
/* detail */
.gal{position:relative;height:min(58vh,520px);height:min(58dvh,520px);min-height:320px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.trk{display:flex;height:100%;transition:transform .35s ease}
.trk.drag{transition:none}
.gs{flex:none;width:100%;height:100%}
.gal .hh{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.gal .dots{bottom:16px}
.gal .dots b{background:rgba(0,0,0,.15);width:28px}
.gal .dots b.on{background:#111}
.info{padding:18px 20px 12px;background:var(--bg)}
.cp{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;margin-bottom:10px}
.tr{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tr h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.4px}
.tr span{font-size:22px;font-weight:700}
.info p{color:var(--mut);font-size:14px;line-height:1.5;margin:8px 0 0}
.sz{margin-top:18px}.sz h4{margin:0 0 10px;font-size:14px;font-weight:600}
.szs{display:flex;gap:8px;flex-wrap:wrap}
.szs button{min-width:52px;height:44px;padding:0 14px;border-radius:30px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;transition:.15s}
.szs button.on{background:#111;color:#fff;border-color:#111}
 .gal-thumbs{position:absolute;left:0;right:0;bottom:12px;z-index:4;display:flex;justify-content:center;gap:7px;padding:0 12px;overflow-x:auto;scrollbar-width:none}.gal-thumb{width:38px;height:38px;flex:none;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#fff;opacity:.8;padding:0}.gal-thumb.on{border-color:#111;opacity:1}.gal-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.bar{flex:none;position:relative;margin-top:auto;background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;display:flex;gap:10px;align-items:center;z-index:4;box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.bar .btn{flex:1}
/* cart */
.ci{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px;margin:0 12px 8px;align-items:stretch}
.ci .th{width:84px;height:84px;border-radius:12px;background:#f1f1f1;flex:none;overflow:hidden}
.ci .th svg{width:100%;height:100%}
.ci .m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.ci small{color:var(--mut);font-size:12px}
.ci b{font-size:14px;font-weight:600;display:block;line-height:1.25}
.ci .pr{font-size:17px;font-weight:700}
.ci .rt{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font-size:12px;color:var(--mut)}
.qty{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink)}
.qty button{width:36px;height:36px;border-radius:10px;background:#f3f3f3;font-size:16px;display:flex;align-items:center;justify-content:center}
.del{width:40px;height:40px;border-radius:50%;background:#fde8ea;color:var(--red);display:flex;align-items:center;justify-content:center;align-self:center;flex:none}
.del .ic{width:16px;height:16px}
.sum{display:flex;justify-content:space-between;align-items:center;width:100%}
.sum small{color:var(--mut);font-size:13px;display:block}
.sum strong{font-size:22px}
.sum .btn{min-width:150px}
/* cards */
.box{background:#fff;border-radius:16px;padding:16px;margin:0 12px 10px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.box p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.box .nm{color:var(--ink);font-weight:600}
.cod{display:flex;align-items:center;gap:12px;border:1.5px solid #111;border-radius:14px;padding:12px}
.rad{width:20px;height:20px;border-radius:50%;border:6px solid #111;flex:none}
.cod b{display:block;font-size:14px}.cod span{font-size:12px;color:var(--mut)}
.ln{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:5px 0}
.ln.t{color:var(--ink);font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
/* search */
.sb{margin:0 12px 10px;height:48px;border-radius:30px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mut)}
.sb input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0}
.gp{display:flex;gap:8px;padding:0 12px 10px}
.gp[hidden]{display:none}
.gp button{padding:8px 18px;border-radius:30px;background:#fafafa;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mut)}
.gp button.on{background:#111;color:#fff;border-color:#111}
.sh{padding:6px 20px 10px;font-size:15px;font-weight:700}
.sr{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin:0 12px 8px;cursor:pointer}
.sr .th{width:64px;height:64px;border-radius:12px;background:#f1f1f1;overflow:hidden;flex:none}
.sr .th svg{width:100%;height:100%}
.sr small{color:var(--mut);font-size:12px}.sr b{display:block;font-size:14px}.sr span{font-weight:700;font-size:14px}
/* profile */
.ph{display:flex;gap:14px;align-items:center}
.av{width:60px;height:60px;border-radius:50%;background:#f1f1f1;display:flex;align-items:center;justify-content:center;flex:none}
.av .ic{width:28px;height:28px}
.ph .i{flex:1;min-width:0}.ph b{font-size:17px;display:block}.ph small{color:var(--mut);font-size:13px;display:block;margin-top:2px;line-height:1.4}
.oh{display:flex;justify-content:space-between;align-items:center}
.st{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:#fff3d6;color:#9a6a00}
.st.d{background:#dff5e3;color:#1c7a34}.st.c{background:#fde8ea;color:var(--red)}
.oa{display:flex;gap:8px;margin-top:12px}
.oa .btn{flex:1}
/* overlays */
.ovl{position:fixed;inset:0;max-width:430px;margin:0 auto;z-index:50;display:flex;align-items:flex-end;background:rgba(0,0,0,.45);animation:fin .2s}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:18px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.fld input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:#fafafa;padding:0 14px;font-size:15px;outline:0}
.fld input:focus{border-color:#111}
.fr{display:flex;gap:10px}.fr .fld{flex:1}
.err{color:var(--red);font-size:13px;min-height:18px;margin-bottom:6px}
.stp{display:flex;justify-content:space-between;position:relative;margin:10px 0 6px}
.stp:before{content:"";position:absolute;left:12%;right:12%;top:13px;height:3px;background:#e5e5e5}
.stp i{position:absolute;left:12%;top:13px;height:3px;background:#111;transition:width .4s}
.sp{width:25%;text-align:center;font-size:12px;position:relative;color:var(--mut);font-weight:500}
.sp u{display:flex;width:28px;height:28px;border-radius:50%;background:#e5e5e5;margin:0 auto 8px;align-items:center;justify-content:center;color:#fff;text-decoration:none}
.sp.on{color:var(--ink)}.sp.on u{background:#111}
.sp u .ic{width:14px;height:14px;stroke-width:3}
.succ{align-items:center;justify-content:center;background:#fff;padding:20px;z-index:60}
.succ .in{text-align:center;width:100%;position:relative;z-index:2}
.ck{width:76px;height:76px;border-radius:50%;background:#111;color:#fff;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;animation:pop .5s}
.ck .ic{width:36px;height:36px;stroke-width:2.5}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.15)}to{transform:scale(1)}}
.succ h2{margin:0 0 6px;font-size:26px}.succ p{margin:0;color:var(--mut);font-size:14px}
.oid{display:inline-block;margin:16px 0;background:#f4f4f4;border-radius:30px;padding:8px 18px;font-weight:700}
.succ .box{margin:0 0 16px;text-align:left}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 22px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;transition:.3s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* app shell: header + independent scroll area + fixed bottom bar */
.scr.fx{height:100vh;height:100dvh;min-height:0;overflow:hidden}
.hdr{flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding-bottom:16px}
.scroll>*{flex:none}
.scroll .empty{margin:auto}
.bar{box-shadow:0 -1px 0 var(--line),0 -10px 24px rgba(0,0,0,.04)}
.sum>div:first-child{min-width:0}
:focus-visible{outline:2px solid #111;outline-offset:2px}
.sheet{max-height:90vh;max-height:90dvh;overscroll-behavior:contain}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#ddd;margin:-8px auto 16px}
.fld input,.sb input{font-size:16px}
.succ{overflow-y:auto;align-items:flex-start}.succ .in{margin:auto 0}
.cat{min-height:44px}.gp button{min-height:40px}
@media(max-width:359px){.tag{display:none}.slide h2{max-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

editModal=function(){if(!fabellUser()){fabellAuthModal();return}const u=state.userProfile,stateOpts=FABELL_STATES.map(x=>`<option value="${x}" ${u.state===x?'selected':''}>${x}</option>`).join(''),f=(k,l,ex='')=>`<div class="fld"><label for="f_${k}">${l}</label><input id="f_${k}" value="${esc(u[k])}" ${ex}></div>`;modal(`<h3>Your delivery details</h3>${f('name','Full name','autocomplete="name"')}${f('phone','Phone number','inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit mobile number"')}${f('house','House No. / Building Name / Flat','autocomplete="address-line1"')}${f('road','Road Name / Area / Colony','autocomplete="address-line2"')}<div class="fr">${f('city','City','autocomplete="address-level2"')}<div class="fld"><label for="f_state">State / Union Territory</label><select id="f_state"><option value="">Select state or UT</option>${stateOpts}</select></div></div>${f('pin','Pincode','inputmode="numeric" maxlength="6" autocomplete="postal-code" placeholder="6 digits"')}<small id="pinHint" style="display:block;color:var(--mut);font-size:12px;margin:4px 0 8px">Enter a 6-digit PIN to look up city and state.</small><div class="err" id="err" role="alert"></div><button class="btn dk" style="width:100%" data-a="saveAddr">Save details</button>`)};

saveAddr=async function(){if(!fabellUser()){fabellAuthModal();return}const k=['name','phone','house','road','city','state','pin'],v={};k.forEach(x=>v[x]=$('#f_'+x)?.value?.trim()||'');v.phone=v.phone.replace(/\D/g,'');const e=k.find(x=>!v[x])?'Please fill in all the fields.':!/^[6-9]\d{9}$/.test(v.phone)?'Enter a valid Indian 10-digit mobile number.':!/^\d{6}$/.test(v.pin)?'Pincode must be 6 digits.':'';if(e){$('#err').textContent=e;return}const button=$('[data-a="saveAddr"]');if(button){button.disabled=true;button.textContent='Saving…'}try{const user=fabellUser(),address={house:v.house,road:v.road,city:v.city,state:v.state,pin:v.pin,name:v.name,phone:v.phone};const {error}=await fabellDb.from('customer_profiles').upsert({user_id:user.id,full_name:v.name,phone:v.phone,address,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;state.userProfile=v;closeM();render();toast('Delivery details saved')}catch(error){const er=$('#err');if(er)er.textContent=error.message||'Could not save details. Please try again.'}finally{const b=$('[data-a="saveAddr"]');if(b){b.disabled=false;b.textContent='Save details'}}};

placeOrder=async function(){if(fabellBusy)return;if(!fabellUser()){toast('Sign in before placing an order');fabellAuthModal();return}if(!addrOK(state.userProfile)){toast('Add your delivery address first');editModal();return}if(!state.cart.length){toast('Your bag is empty');return}fabellBusy=true;const btn=$('[data-a="place"]');if(btn){btn.disabled=true;btn.textContent='Placing…'}try{const items=state.cart.map(x=>{const p=byId(x.id);return{id:String(p.dbId??p.id),qty:x.qty,size:x.size||''}});const {data,error}=await fabellDb.rpc('place_store_order',{p_items:items,p_shipping_address:fabellAddressPayload()});if(error)throw error;const order=data?.order_number||'Order placed';state.cart=[];upBadge();await fabellLoadCustomer();$('#ovl').innerHTML=`<div class="ovl succ"><div class="in"><div class="ck">${ic('check')}</div><h2>Order placed!</h2><p>Your Fabell order has been saved. You can track its progress from My Profile.</p><div class="oid">${esc(order)}</div><div class="box"><div class="ln t"><span>Total (Cash on Delivery)</span><span>${rs(data?.total??0)}</span></div></div><button class="btn dk" style="width:100%" data-a="orders">View my orders</button></div></div>`;chime();confetti()}catch(e){console.error(e);toast(e.message||'Could not place the order. Please try again.')}finally{fabellBusy=false;const b=$('[data-a="place"]');if(b){b.disabled=false;b.textContent='Place Order'}}};
trackModal=function(id){const o=fabellCustomerOrders.find(x=>x.id===id);if(!o){toast('Order not found. Refresh your profile and try again.');return}const labels={placed:'Order placed',confirmed:'Confirmed',processing:'Processing',dispatched:'Dispatched',in_transit:'In transit',out_for_delivery:'Out for delivery',delivered:'Delivered',cancelled:'Cancelled',returned:'Returned'};const status=labels[o.status]||String(o.status||'placed').replaceAll('_',' ');const history=Array.isArray(o.status_history)?o.status_history:[];modal(`<h3>Track ${esc(o.order_number||o.id)}</h3><div class="box"><b>${esc(status)}</b>${o.tracking_note?`<p>${esc(o.tracking_note)}</p>`:''}${o.tracking_carrier?`<p>Courier: ${esc(o.tracking_carrier)}</p>`:''}${o.tracking_number?`<p>Tracking number: ${esc(o.tracking_number)}</p>`:''}${o.estimated_delivery?`<p>Estimated delivery: ${esc(o.estimated_delivery)}</p>`:''}${o.tracking_url?`<p><a href="${esc(o.tracking_url)}" target="_blank" rel="noopener noreferrer">Track with courier ↗</a></p>`:''}</div>${history.length?`<h4>Updates</h4>${history.slice().reverse().map(h=>`<div class="box"><b>${esc(labels[h.status]||h.status||'Update')}</b><p>${esc(h.note||'')}</p><small>${h.at?new Date(h.at).toLocaleString():''}</small></div>`).join('')}`:''}<button class="btn dk" style="width:100%;margin-top:12px" data-a="closeM">Close</button>`)};
let fabellPinLookupTimer;document.addEventListener('input',e=>{if(e.target.id!=='f_pin')return;const pin=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=pin;clearTimeout(fabellPinLookupTimer);if(pin.length!==6)return;fabellPinLookupTimer=setTimeout(async()=>{const hint=$('#pinHint');if(hint)hint.textContent='Looking up PIN code…';try{const response=await fetch('https://api.postalpincode.in/pincode/'+pin);const data=await response.json();const po=data?.[0]?.PostOffice?.[0];if(!po)throw new Error('No post office found');const city=$('#f_city'),st=$('#f_state');if(city)city.value=po.District||po.Block||po.Name||city.value;if(st){const found=[...st.options].find(o=>o.value.toLowerCase()===String(po.State||'').toLowerCase());if(found)st.value=found.value}if(hint)hint.textContent='PIN found: '+(po.District||po.Name)+', '+po.State+'. Please confirm the details.'}catch(err){if(hint)hint.textContent='Could not look up this PIN automatically. Enter city and state manually.'}},350)});

// Keep the current shared storefront session in sync across tabs and reloads.
fabellDb.auth.onAuthStateChange((event,session)=>{fabellSession=session;setTimeout(async()=>{try{if(event==='PASSWORD_RECOVERY'){modal(`<h3>Set a new password</h3><div class=\"fld\"><label for=\"newPassword\">New password</label><input id=\"newPassword\" type=\"password\" minlength=\"6\" autocomplete=\"new-password\" placeholder=\"At least 6 characters\"></div><div id=\"passwordMsg\" class=\"err\" role=\"status\"></div><button class=\"btn dk\" style=\"width:100%\" data-a=\"authSetPassword\">Update password</button>`);return}await fabellLoadCustomer();if(state.currentScreen==='profile'||state.currentScreen==='checkout')render(true)}catch(e){console.warn('Could not refresh customer account data',e)}},0)});
// Extend the existing design's action dispatcher without disturbing shopping interactions.
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(a==='authOpen'){fabellAuthModal()}else if(a==='authGoogle'){const {error}=await fabellDb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(error){const msg=$('#authMsg');if(msg)msg.textContent=error.message;else toast(error.message)}}else if(['authSignIn','authSignUp','authReset'].includes(a)){e.preventDefault();await fabellAuthAction(a)}else if(a==='authSetPassword'){const password=$('#newPassword')?.value||'',msg=$('#passwordMsg');if(password.length<6){msg.textContent='Password must be at least 6 characters.';return}const {error}=await fabellDb.auth.updateUser({password});if(error){msg.textContent=error.message;return}closeM();toast('Password updated');}else if(a==='authSignOut'){await fabellDb.auth.signOut();fabellSession=null;await fabellLoadCustomer();state.currentScreen='profile';render();toast('Signed out')} });
// Replace demo-only local tracking and cancellation actions with database-backed information.
async function fabellInitSession(){const {data,error}=await fabellDb.auth.getSession();if(error)throw error;fabellSession=data.session;await fabellLoadCustomer()}

render();
setTimeout(async()=>{try{await fabellInitSession();await fabellLoadStore();if(state.currentScreen==='profile')render(true)}catch(e){console.warn(e);fabellLoadStore()}},0);
</script></body></html>
